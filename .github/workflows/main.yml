name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Build Docker Image
        run: docker build -t asli_connect-app .

      # Login to DockerHub
      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Tag Docker Image
      - name: Tag Docker Image
        run: docker tag asli_connect-app madhvika/asli_connect:latest

      # Push Docker Image
      - name: Push Docker Image
        run: docker push madhvika/asli_connect:latest

      # Deploy into AWS EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            docker stop asli_connect-container || true

            docker rm asli_connect-container || true

            docker pull madhvika/asli_connect:latest

             docker run -d \
              --name asli_connect-container \
              -p 8080:8080 \
              madhvika/asli_connect:latest

